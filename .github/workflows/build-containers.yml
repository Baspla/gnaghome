name: Build Containers

on:
  workflow_dispatch:
  push:
    paths:
      - backend/**
      - frontend/**
      - shared/**
      - bun.lock
      - package.json
      - backend/Dockerfile
      - frontend/Dockerfile
      - .dockerignore
      - .github/workflows/backend-tests.yml
      - .github/workflows/build-containers.yml
  pull_request:
    paths:
      - backend/**
      - frontend/**
      - shared/**
      - bun.lock
      - package.json
      - backend/Dockerfile
      - frontend/Dockerfile
      - .dockerignore
      - .github/workflows/backend-tests.yml
      - .github/workflows/build-containers.yml

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Run backend tests
    uses: ./.github/workflows/backend-tests.yml
    permissions:
      contents: read

  build:
    name: Build ${{ matrix.service }} image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            dockerfile: ./backend/Dockerfile
          - service: frontend
            dockerfile: ./frontend/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ github.ref_name }}-latest,enable=${{ github.ref != 'refs/heads/main' && github.event_name != 'pull_request' }}
            type=sha,prefix=sha-

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy-production:
    name: Trigger production deployment
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    steps:
      - name: Call production redeploy webhook
        env:
          PRODUCTION_DEPLOY_WEBHOOK_URL: ${{ secrets.PRODUCTION_DEPLOY_WEBHOOK_URL }}
        run: |
          if [[ -z "$PRODUCTION_DEPLOY_WEBHOOK_URL" ]]; then
            echo "::error::Set the PRODUCTION_DEPLOY_WEBHOOK_URL repository secret to enable production deployments."
            exit 1
          fi

          curl --fail --silent --show-error --max-time 30 \
            --request POST \
            "$PRODUCTION_DEPLOY_WEBHOOK_URL"
